services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rahbeh
      POSTGRES_PASSWORD: rahbeh
      POSTGRES_DB: rahbeh
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./api
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rahbeh:rahbeh@db/rahbeh
    depends_on: [db]
    ports: ["8000:8000"]
  web:
    build: ./web
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
